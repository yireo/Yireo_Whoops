aliases: []
summary: Whoops error pages expose credentials, session data and frame arguments to visitors
details: >
  With the setting yireo_whoops/settings/override enabled, the full Whoops error page was shown to
  every visitor in production mode. These pages included stack frame arguments, server and
  environment variables, cookies, session data, POST data and HTTP authorization headers, allowing
  an unauthenticated visitor who triggers an error to read credentials and session secrets. Even in
  developer mode, several sensitive values were not masked. Version 1.0.0 removes the override
  setting and version 0.2.6 ignores it, so Whoops only runs in developer mode. Both versions respect
  dev/restrict/allow_ips, remove frame arguments from the HTML page (and in 1.0.0 also from the JSON
  trace), and mask authorization headers, passwords, payment and form_key data, session cookies and
  session contents.
