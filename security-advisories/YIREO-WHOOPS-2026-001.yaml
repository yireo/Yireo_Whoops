id: YIREO-WHOOPS-2026-001
published: "2026-11-25T00:00:00Z"
modified: "2026-11-26T00:00:00Z"
aliases: []
summary: Editor setting allows arbitrary PHP callables to be executed for every stack frame
details: >
  The configuration value yireo_whoops/settings/editor was passed unchecked to the Whoops
  PrettyPageHandler. Whoops treats any is_callable() string as an editor callback and calls it with
  the file path and line number of every stack frame. A user with access to the configuration (or
  anyone able to write this value to core_config_data) could set it to a PHP function such as
  file_put_contents, which overwrote the source files of the frames whenever an error page was
  rendered. Versions 0.2.6 and 1.0.0 only accept editor values offered by the source model.
